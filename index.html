<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>五子棋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 15% 0%, #1a6a70 0%, transparent 45%),
          radial-gradient(ellipse at 85% 10%, #3a2060 0%, transparent 50%),
          linear-gradient(180deg, #0a2438 0%, #04101c 100%);
        font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        width: min(100vw, calc(100vh * 900 / 1400));
        height: min(100vh, calc(100vw * 1400 / 900));
        max-width: 900px;
        max-height: 1400px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.55),
          0 0 0 3px rgba(46, 232, 160, 0.35);
      }
      #game-container canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
